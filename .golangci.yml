version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print(f|ln)?$
          msg: output goes through the terminal abstraction, not fmt.Print*
        - pattern: ^os\.(Stdout|Stderr)$
          msg: only internal/term and cmd/abot may use the standard streams
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: ^(internal/term|cmd/abot)/
        linters:
          - forbidigo
      - linters:
          - gosec
        text: G304
      - path: _test\.go$
        linters:
          - gosec
        text: G204|G702|G703

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/appifyhub/agent-cli
