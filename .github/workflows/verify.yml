name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...

      - name: Test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

      - name: Test the built binaries
        shell: bash
        run: sh scripts/e2e.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Check final newlines
        run: sh scripts/check-eof.sh

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Check the GoReleaser configuration
        run: |
          # brews is intentionally retained for Linux and unsigned macOS installs
          if goreleaser check; then
            exit 0
          else
            status=$?
            test "$status" -eq 2
          fi

      - name: Scan dependencies for vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  packages:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          install-only: true

      - name: Install package inspection tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y rpm

      - name: Build release packages without publishing
        run: sh tools/release ga --snapshot

      - name: Verify Linux package artifacts
        run: |
          set -eu
          set -- dist/*.deb dist/*.rpm
          test "$#" -eq 4
          for package in dist/*.deb; do
            test "$(dpkg-deb --field "$package" Package)" = abot
            dpkg-deb --contents "$package"
          done
          for package in dist/*.rpm; do
            test "$(rpm -qp --queryformat '%{NAME} %{LICENSE}' "$package")" = "abot MIT"
            rpm -qlvp "$package"
          done
          sudo dpkg --install dist/abot_*_amd64.deb
          test "$(readlink /usr/bin/@abot)" = abot
          abot --version
          /usr/bin/@abot --version
