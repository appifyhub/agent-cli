version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    groups:
      gomod-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "Dependabot"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 7
    groups:
      actions-all:
        patterns:
          - "*"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    labels:
      - "Dependabot"
