  {name} chats default
  {name} chats default --set "3f2a9c1e7b6d4a58b0c1d2e3f4a5b6c7"
  {name} chats default --platform whatsapp
  {name} chats default --clear'''
environment = "Environment: THE_AGENT_CLI_HOME, THE_AGENT_CLI_API_URL, THE_AGENT_CLI_TOKEN, THE_AGENT_CLI_PASSPHRASE, THE_AGENT_CLI_DEFAULT_CHAT, THE_AGENT_CLI_DEFAULT_PLATFORM"
exit_codes = "Exit codes: 0 ok · 1 request or local state failure · 2 usage or validation error · 3 not connected, locked or revoked · 4 chat unreachable · 5 insufficient credits · 6 rate limited"

[command.chats_default]
short = "Show, set or clear the default target"
long = '''Without flags, show the effective default chat, platform, or latest-chat fallback and a tip. This works offline without reading credentials, prompting, contacting the backend or writing files.
To change the stored default, choose one of --set <chat-id>, --platform telegram|whatsapp, or --clear.
--set matches the id exactly, ignoring case, against your authenticated chat list and caches the server's id, platform, title and privacy in config.toml. An unknown id leaves the default unchanged. Run {name} chats to find an id.
--platform accepts either platform in any case and replaces a chat default. --clear removes the stored default, even if none is set. Both work offline without reading credentials or prompting.
Only the default target is changed; device identity, backend address and connection metadata are preserved. State lives under THE_AGENT_CLI_HOME, otherwise ~/.<command name>.
THE_AGENT_CLI_DEFAULT_CHAT wins over THE_AGENT_CLI_DEFAULT_PLATFORM, then the stored default. Environment defaults are labelled with their variable name. Changes update the stored default, not environment variables.'''
examples = '''  {name} chats default
  {name} chats default --set "3f2a9c1e7b6d4a58b0c1d2e3f4a5b6c7"
  {name} chats default --platform telegram
  {name} chats default --platform WhatsApp
  {name} chats default --clear'''
environment = "Environment: THE_AGENT_CLI_HOME, THE_AGENT_CLI_API_URL, THE_AGENT_CLI_TOKEN, THE_AGENT_CLI_PASSPHRASE, THE_AGENT_CLI_DEFAULT_CHAT, THE_AGENT_CLI_DEFAULT_PLATFORM"
exit_codes = "Exit codes: 0 ok · 1 request or local state failure · 2 usage, unknown chat or invalid platform · 3 not connected, locked or revoked · 4 chat unreachable · 5 insufficient credits · 6 rate limited"
flag_set = "Set the stored default to one of your chat IDs"
