[command.skill]
short = "Teach AI coding agents to use this CLI"
long = '''Teach coding agents to use {name}. Commands: status, install [agent], remove [agent], show.
Install and remove require one agent or explicit --all. Agents need not be installed. No hooks, settings changes or instruction-file edits.
Supported agents: claude, codex, opencode, pi, omp, windsurf, cursor, gemini, antigravity.
User scope is the default (--user). --project uses the native agent path under the exact current directory, never a Git root.
User paths: Claude Code uses $CLAUDE_CONFIG_DIR/skills or ~/.claude/skills; Antigravity uses ~/.gemini/config/skills; all others use ~/.agents/skills.
Project paths: Claude Code uses .claude/skills; all others use .agents/skills. Each path ends in the build's command name.
Agents sharing a directory share one skill: removing it affects every agent reading that directory.
For an agent without skill support, show --pointer prints text to paste yourself. show prints the full guide without installation.'''
examples = '''  {name} skill show
  {name} skill install codex
  {name} skill install --all --dry-run
  {name} skill status
  {name} skill remove codex'''
environment = "Environment: CLAUDE_CONFIG_DIR (Claude user skill location only); no credentials or CLI config are read"
exit_codes = "Exit codes: 0 ok · 1 filesystem failure or conflict · 2 usage error or unknown agent"

[command.skill_show]
short = "Print the shared guide for coding agents"
long = "Print the guide to stdout without installation, files, credentials or network access. --pointer prints at most six lines for you to paste into another agent's instruction file; this command never edits that file."
examples = '''  {name} skill show
  {name} skill show --pointer'''
environment = "Environment: none"
exit_codes = "Exit codes: 0 ok · 1 output failure · 2 usage error"

[command.skill_install]
short = "Install pointer skills for one agent or all agents"
long = '''Install a shared-guide pointer for one named agent, or use --all for every supported agent. Do not combine an agent with --all. Agents need not be installed.
--user is the default: Claude Code uses $CLAUDE_CONFIG_DIR/skills or ~/.claude/skills, Antigravity ~/.gemini/config/skills, and all other agents ~/.agents/skills.
--project uses .claude/skills for Claude Code or .agents/skills for every other agent, under the exact cwd even outside Git. User overrides do not affect project paths. Each skill directory is named {name}.
The two scope flags are mutually exclusive. Current stubs are unchanged; older or edited owned stubs are updated. Foreign skills conflict unless --force replaces them. --dry-run writes nothing.
No hooks, settings changes or instruction-file edits. See skill show --pointer for other agents.'''
examples = '''  {name} skill install codex
  {name} skill install claude --user
  {name} skill install antigravity --project --dry-run'''
environment = "Environment: CLAUDE_CONFIG_DIR (Claude user scope only); system user home for --user"
exit_codes = "Exit codes: 0 installed, updated or unchanged · 1 filesystem failure or conflict · 2 usage error or unknown agent"

[command.skill_status]
short = "Inspect pointer skills without changing files"
long = '''Report current, outdated, missing, foreign or unreadable skills. --agent optionally filters claude, codex, opencode, pi, omp, windsurf, cursor, gemini or antigravity; repeat it to select several.
--user is the default. Claude Code uses $CLAUDE_CONFIG_DIR/skills or ~/.claude/skills; Antigravity uses ~/.gemini/config/skills; all other agents use ~/.agents/skills.
--project uses .claude/skills for Claude Code and .agents/skills otherwise, under the exact cwd without Git-root lookup or user overrides. The scope flags are mutually exclusive.
Shared paths reflect shared state, not separate copies. No hooks, settings, instruction files, credentials or network access; missing directories are not created.'''
examples = '''  {name} skill status
  {name} skill status --project --agent claude --agent codex'''
environment = "Environment: CLAUDE_CONFIG_DIR (Claude user scope only); system user home for --user"
exit_codes = "Exit codes: 0 reported, including missing or unreadable skills · 1 location or output failure · 2 usage error or unknown agent"

[command.skill_remove]
short = "Remove owned pointer skills"
long = '''Remove owned skills only; foreign skills and unrelated files are left alone. Empty build-named directories are removed, but parent directories and sibling skills remain.
Select one positional agent or --all for every supported location. Do not combine an agent with --all. Bare remove changes nothing and reports a usage error.
--user is the default: Claude Code uses $CLAUDE_CONFIG_DIR/skills or ~/.claude/skills, Antigravity ~/.gemini/config/skills, and all others ~/.agents/skills.
--project uses .claude/skills for Claude Code and .agents/skills otherwise, under the exact cwd, not a Git root, ignoring user overrides. The scope flags are mutually exclusive. --dry-run changes nothing.
Shared locations are removed once: removing one makes the skill unavailable to every agent reading that same path. No hooks, settings or instruction files are edited.'''
examples = '''  {name} skill remove codex
  {name} skill remove --all --project --dry-run'''
environment = "Environment: CLAUDE_CONFIG_DIR (Claude user scope only); system user home for --user"
exit_codes = "Exit codes: 0 removed, missing or foreign · 1 filesystem or output failure · 2 usage error or unknown agent"

[skill]
pointer = '''Run {name} skill show and follow its guide before using {name} to notify the user.
If that command fails, run {name} --help.
'''
unlock_unix = 'eval "$({name} unlock)"'
unlock_windows = "{name} unlock --shell pwsh | Invoke-Expression"
stub_description = "Use {name} to notify the user through their agent when requested or when a long task finishes or needs attention."
flag_pointer = "Print a short instruction for agents without skill support"
flag_user = "Use the agent's user skill location (default)"
flag_project = "Use the native agent skill path under the exact current directory"
flag_agent = "Select an agent; repeat to select several (default: all)"
flag_force = "Replace a foreign skill at this build's skill path"
flag_dry_run = "Report planned actions without changing files"
flag_all = "Select every supported agent (shared directories are handled once)"
scope_conflict = "use either --user or --project, not both"
selection_usage = "skill {operation} requires one agent or --all, not both"
unknown_agent = 'unknown agent "{agent}"; supported agents: {agents}'
location_error = "could not determine the selected skill location"
io_error = "could not manage skill at {path}: {reason}"
report = "{agent}: {result} — {path}"

