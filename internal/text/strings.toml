confirmation_required = "refusing to revoke without confirmation; pass --yes"
success = "✓ Access revoked for all CLIs. Local token removed."
success_no_local = "✓ Access revoked for all CLIs."
already_revoked = "✓ Already revoked. Local token removed."
unreachable = "could not reach the server; local token kept"
