[command.chats]
short = "List chats and manage the default target"
long = '''List the chats you can notify, in the order the backend returns them, with full titles and whether each is private.
The * marker identifies the effective default chat: THE_AGENT_CLI_DEFAULT_CHAT wins over THE_AGENT_CLI_DEFAULT_PLATFORM, then the stored default. A platform default marks no row.
Listing requires a connection or THE_AGENT_CLI_TOKEN. A passphrase-protected token is unlocked using THE_AGENT_CLI_PASSPHRASE or a terminal prompt.
Use {name} chats default to show the effective default offline, or its --set, --platform and --clear flags to change the stored default in config.toml.

Example table:
{sample}'''
