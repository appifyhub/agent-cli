[command.unlock]
short = "Unlock a passphrase-protected token for this terminal"
long_unix = '''Decrypt the stored token without contacting the backend. Only a shell assignment goes to stdout; prompts, confirmations and errors go to stderr.
Apply it in sh, bash or zsh with: eval "$({name} unlock)"
In fish: {name} unlock --shell fish | source
THE_AGENT_CLI_PASSPHRASE supplies the passphrase, otherwise a terminal prompt is required. The default syntax is sh; use --shell to choose another shell.
The exported token is inherited by child processes, not other terminals. Run unset THE_AGENT_CLI_TOKEN to remove it. Avoid running unlock directly on a terminal or saving its output: the assignment contains your token and may remain in scrollback or files.'''
long_windows = '''Decrypt the stored token without contacting the backend. Only a shell assignment goes to stdout; prompts, confirmations and errors go to stderr.
Apply it in PowerShell with: {name} unlock --shell pwsh | Invoke-Expression
THE_AGENT_CLI_PASSPHRASE supplies the passphrase, otherwise a terminal prompt is required. The default syntax is pwsh; use --shell to choose another shell.
The exported token is inherited by child processes, not other terminals. Run Remove-Item Env:THE_AGENT_CLI_TOKEN to remove it. Avoid running unlock directly on a terminal or saving its output: the assignment contains your token and may remain in scrollback or files.'''
examples_unix = '''  eval "$({name} unlock)"
  {name} unlock --shell fish | source'''
examples_windows = '''  {name} unlock --shell pwsh | Invoke-Expression'''
environment = "Environment: THE_AGENT_CLI_HOME, THE_AGENT_CLI_TOKEN, THE_AGENT_CLI_PASSPHRASE"
exit_codes = "Exit codes: 0 ok · 1 local failure · 2 usage error · 3 not connected or locked"
flag_shell = "Assignment syntax: sh, bash, zsh, fish, pwsh, powershell"

